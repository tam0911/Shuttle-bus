<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f3d32" />
    <meta name="description" content="豫豐花園居民巴士、藍地站九巴及輕鐵班次。" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="豫豐出行" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>豫豐花園居民巴士</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,650&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=31" />
  </head>
  <body>
    <div class="sheet-page">
      <header class="mast">
        <div class="brand">
          <p class="estate">The Sherwood</p>
          <h1>豫豐花園出行</h1>
        </div>
        <div class="now" aria-live="polite">
          <p class="now-date" id="now-date">香港時間</p>
          <p class="now-clock" id="now-clock">--:--</p>
        </div>
      </header>

      <main class="modes">
        <section class="mode mode-shuttle" aria-labelledby="shuttle-title">
          <div class="mode-head">
            <h2 id="shuttle-title">居民巴士</h2>
            <p>每日包括公眾假期</p>
          </div>
          <div class="switcher" role="radiogroup" aria-label="選擇路線與方向">
            <button type="button" class="dir" role="radio" aria-checked="true" data-id="nr762-out">
              <span class="code">NR762</span>
              <span class="dest">往兆康站</span>
            </button>
            <button type="button" class="dir" role="radio" aria-checked="false" data-id="nr762-in">
              <span class="code">NR762</span>
              <span class="dest">兆康開出</span>
            </button>
            <button type="button" class="dir" role="radio" aria-checked="false" data-id="nr762a-out">
              <span class="code">NR762A</span>
              <span class="dest">往市中心</span>
            </button>
            <button type="button" class="dir" role="radio" aria-checked="false" data-id="nr762a-in">
              <span class="code">NR762A</span>
              <span class="dest">市中心開出</span>
            </button>
          </div>

          <article class="next" id="next">
            <div class="route-band">
              <div>
                <p class="route-code" id="route-code">NR762</p>
                <p class="route-name" id="route-name">豫豐花園 → 港鐵兆康站</p>
                <p class="route-en" id="route-en">The Sherwood → Siu Hong Station</p>
              </div>
            </div>

            <p class="kicker" id="kicker">下一班</p>
            <div class="time-row">
              <p class="big-time" id="big-time">--:--</p>
              <p class="delta" id="delta">計算中</p>
            </div>
            <p class="missed" id="missed" hidden></p>

            <div class="follow-row">
              <p class="follow-label">其後</p>
              <div class="follow" id="follow" aria-label="其後班次"></div>
              <p class="last-bus">尾班 <strong id="last-bus-time">22:00</strong></p>
            </div>
          </article>

          <p class="hint" id="hint"></p>
        </section>

        <section class="mode mode-bus" aria-labelledby="bus-title">
          <div class="mode-head">
            <h2 id="bus-title">九龍巴士(藍地站)</h2>
            <p id="kmb-status">藍地站</p>
          </div>
          <div id="kmb-board"></div>
        </section>

        <section class="mode mode-lrt" aria-labelledby="lrt-title">
          <div class="mode-head">
            <h2 id="lrt-title">輕鐵(藍地站)</h2>
            <p id="lrt-status">藍地站</p>
          </div>
          <div id="lrt-board"></div>
        </section>
      </main>
    </div>
    <script src="app.js?v=24"></script>
    <script src="kmb.js?v=30"></script>
    <script>
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
    </script>
  </body>
</html>
